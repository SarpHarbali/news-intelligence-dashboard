<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>News Intelligence Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .article-thumb { width: 100%; height: 100%; min-height: 120px; object-fit: cover; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">News Intelligence Dashboard</a>
            <div class="navbar-nav">
                <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">Search</a>
                <a class="nav-link {% if request.url.path == '/bookmarks' %}active{% endif %}" href="/bookmarks">Bookmarks</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
